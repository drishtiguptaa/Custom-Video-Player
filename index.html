<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>video player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="player">
      <!-- video -->
      <video src="./videofinal.mp4" class="video"></video>

      <!-- video controls -->
      <div class="show-controls">
        <!-- progress bar -->
        <div class="progress-range">
          <div class="progress-bar"></div>
        </div>

        <div class="control-group">
          <div class="left controls">
            <!-- play/pause controls -->
            <div class="play button">
              <i
                class="fa-solid fa-play"
                id="play-btn"
                title="Play"
                style="color: white"
              ></i>
            </div>

            <!-- forward/backward skip -->
            <div class="backward-skip">
              <i
                class="fa-solid fa-backward-step"
                id="rewind-btn"
                title="Rewind 10s"
                style="color: white"
              ></i>
            </div>
            <div class="forward-skip">
              <i
                class="fa-solid fa-forward-step"
                id="forward-btn"
                title="Forward 10s"
                style="color: white"
              ></i>
            </div>

            <!-- volume controls -->
            <div class="volume control">
              <div class="volume-icon">
                <i
                  class="fa-solid fa-volume-high"
                  id="volume-icon"
                  title="Mute"
                  style="color: white"
                ></i>
              </div>

              <div class="volume-range" title="Volume">
                <div class="volume-bar"></div>
              </div>
            </div>

            <!-- time controls -->
            <div class="time">
              <span class="time-elapsed"></span>
              <span class="time-duration"></span>
            </div>
          </div>

          <div class="right controls">
            <!-- playback speed controls -->
            <div class="speed" title="Playback Speed">
              <select name="playbackspeed" class="playback-speed">
                <option value="0.5">0.5 x</option>
                <option value="0.75">0.75 x</option>
                <option value="1.0" selected>1.0 x</option>
                <option value="1.5">1.5 x</option>
                <option value="2.0">2.0 x</option>
              </select>
            </div>

            <!-- fullscreen  -->
            <div class="fullscreen">
              <i
                class="fa-solid fa-up-right-and-down-left-from-center"
                id="fullscreen-icon"
                style="color: white"
                title="Fullscreen"
              ></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
